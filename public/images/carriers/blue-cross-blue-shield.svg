    <rect x="0" y="11" width="26" height="8" rx="1.25" />
    <rect x="9" y="2" width="8" height="26" rx="1.25" />
    <!-- Blue Shield -->
    <path
      d="M32 2.5c5.8 2 9.6 2.6 12.5 2.6v10.8c0 4.2-3 7.6-12.5 11.3C22.5 23.5 19.5 20.1 19.5 16V5.1C22.4 5.1 26.2 4.5 32 2.5z"
